<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermea</title>
<link rel="icon" href="/app/mark.png">
<script>
  // тема и язык — до первой отрисовки, чтобы окно не мигало
  window.BOOT = __BOOT__;
  window.TOKEN = "__TOKEN__";
  document.documentElement.dataset.theme = (window.BOOT && window.BOOT.theme) || "auto";
  document.documentElement.lang = (window.BOOT && window.BOOT.lang) || "ru";
  window.ZOOM = ((window.BOOT && window.BOOT.scale) || 100) / 100;
  if (window.ZOOM !== 1) document.documentElement.style.zoom = window.ZOOM;
  // при масштабе окна (80%, 110%…) 100vh не совпадает с реальной высотой — считаем свою
  document.documentElement.style.setProperty("--z", window.ZOOM);
</script>
<link rel="stylesheet" href="/app/base.css">
<link rel="stylesheet" href="/app/photo.css">
<link rel="stylesheet" href="/app/svk.css">
<link rel="stylesheet" href="/app/clients.css">
<link rel="stylesheet" href="/app/owners.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <img class="logo" src="/app/logo_row.png" alt="Hermea">
    <nav class="modes" id="modes" aria-label="Hermea"><i class="ind"></i>
      <button type="button" data-mode="photo" data-i18n="m_photo"></button>
      <button type="button" data-mode="svk"><span data-i18n="m_svk"></span><span class="dot" id="svkDot" hidden></span></button>
      <button type="button" data-mode="clients" data-i18n="m_clients"></button>
      <button type="button" data-mode="market" data-i18n="m_market"></button>
      <button type="button" data-mode="owners" data-i18n="m_owners"></button>
    </nav>
  </div>
  <div class="bar-right">
    <button class="bar-btn tg" id="tg" type="button"><span class="dot"></span><span id="tgText"></span></button>
    <button class="bar-btn gear" id="gear" type="button" aria-expanded="false" data-i18n-aria="settings" data-i18n-title="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<div class="banner update" id="updBanner" hidden>
  <span><b id="updTitle"></b> <span class="muted" id="updNotes"></span></span>
  <button type="button" id="updBtn" data-i18n="upd_install"></button>
</div>
<div class="banner" id="pending" hidden>
  <span id="pendingText"></span>
  <button type="button" id="flushBtn" data-i18n="send_now"></button>
</div>

<div class="pop" id="pop" hidden role="dialog" data-i18n-aria="settings">
  <section>
    <h4 data-i18n="theme"></h4>
    <div class="seg" id="segTheme">
      <button type="button" data-theme-v="auto" data-i18n="theme_auto"></button>
      <button type="button" data-theme-v="light" data-i18n="theme_light"></button>
      <button type="button" data-theme-v="dark" data-i18n="theme_dark"></button>
    </div>
  </section>
  <section>
    <h4 data-i18n="language"></h4>
    <div class="seg" id="segLang">
      <button type="button" data-lang-v="uk">Українська</button>
      <button type="button" data-lang-v="ru">Русский</button>
      <button type="button" data-lang-v="pl">Polski</button>
    </div>
  </section>
  <section>
    <h4 data-i18n="scale"></h4>
    <div class="seg" id="segScale">
      <button type="button" data-scale-v="80">80%</button>
      <button type="button" data-scale-v="90">90%</button>
      <button type="button" data-scale-v="100">100%</button>
      <button type="button" data-scale-v="110">110%</button>
    </div>
  </section>
  <section>
    <h4 id="verTitle"></h4>
    <p class="upd-line" id="updLine"></p>
    <button class="btn" type="button" id="updCheck" data-i18n="upd_check"></button>
    <button class="btn-primary sm" type="button" id="updApply" hidden data-i18n="upd_install"></button>
  </section>
</div>

<aside class="side">
  <div class="search"><input id="search" type="search" autocomplete="off" data-i18n-ph="search_ph" data-i18n-aria="search_ph"></div>
  <nav class="list" id="list"></nav>
  <footer class="side-foot">
    <p id="today"></p>
    <button class="link" type="button" id="openRoot" data-i18n="open_root"></button>
  </footer>
</aside>

<main class="main" id="main">
  <section class="composer">
    <h1 class="display" data-i18n="heading"></h1>
    <form class="slot" id="form" autocomplete="off">
      <textarea id="link" rows="1" spellcheck="false" placeholder="https://www.otodom.pl/pl/oferta/…" data-i18n-aria="link_aria"></textarea>
      <button class="btn-primary" id="go" type="submit" data-i18n="create"></button>
    </form>
    <div class="opts">
      <label class="switch"><input type="checkbox" id="tgSend" checked><span class="track"></span><span data-i18n="send_tg"></span></label>
      <label class="switch nofee" data-i18n-title="no_fee_tip"><input type="checkbox" id="noFee"><span class="track"></span><span data-i18n="no_fee"></span></label>
      <button class="btn" type="button" id="ownBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 8"/></svg>
        <span data-i18n="own_btn"></span>
      </button>
      <span class="hint" data-i18n="hint"></span>
    </div>
    <input type="file" id="ownFile" multiple accept="image/*,.heic,.HEIC" hidden>
    <div class="notice" id="notice" hidden></div>
  </section>
  <section class="work" id="work"></section>
</main>
<section class="svk" id="svk" aria-live="polite"></section>
<section class="aux" id="clients"></section>
<section class="aux" id="market"></section>
<section class="aux" id="owners"></section>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" data-i18n-aria="viewer">
  <div class="lb-wrap">
    <div class="lb-stage" id="lbStage">
      <img id="lbAfter" alt="" draggable="false">
      <div class="lb-before" id="lbBefore"><img id="lbBeforeImg" alt="" draggable="false"></div>
      <div class="lb-handle" id="lbHandle"></div>
      <span class="lb-tag l" id="lbTagL" data-i18n="before"></span>
      <span class="lb-tag r" id="lbTagR" data-i18n="after"></span>
    </div>
  </div>
  <span class="lb-zoom" id="lbZoom"></span>
  <div class="lb-bar">
    <span id="lbCount"></span>
    <span class="grow" id="lbHint"></span>
    <span class="bar-z"><button class="btn" type="button" id="lbOut" data-i18n-aria="zoom_out">−</button><button class="btn" type="button" id="lbIn" data-i18n-aria="zoom_in">+</button></span>
    <button class="btn" type="button" id="lbReveal" data-i18n="reveal"></button>
    <button class="btn" type="button" id="lbClose" data-i18n="close"></button>
  </div>
  <button class="lb-nav prev" type="button" id="lbPrev" data-i18n-aria="prev_photo">‹</button>
  <button class="lb-nav next" type="button" id="lbNext" data-i18n-aria="next_photo">›</button>
</div>

<div class="drop" id="drop" hidden><div><b data-i18n="drop_title"></b></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="gone" id="gone" hidden><div><b data-i18n="gone_title"></b><p data-i18n="gone_text"></p></div></div>

<script src="/app/i18n.js"></script>
<script src="/app/core.js"></script>
<script src="/app/photo.js"></script>
<script src="/app/svk.js"></script>
<script src="/app/templates.js"></script>
<script src="/app/clients.js"></script>
<script src="/app/owners.js"></script>
</body>
</html>
