<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermea</title>
<link rel="icon" href="/app/mark.png">
<script>
  // тема и язык — до первой отрисовки, чтобы окно не мигало
  window.BOOT = __BOOT__;
  document.documentElement.dataset.theme = (window.BOOT && window.BOOT.theme) || "auto";
  document.documentElement.lang = (window.BOOT && window.BOOT.lang) || "ru";
  window.ZOOM = ((window.BOOT && window.BOOT.scale) || 100) / 100;
  if (window.ZOOM !== 1) document.documentElement.style.zoom = window.ZOOM;
</script>
<style>
@font-face {
  font-family: "Hermea Serif";
  src: url("/app/cormorant.woff2") format("woff2");
  font-weight: 300 700;
  font-display: swap;
}
:root, html[data-theme="light"] {
  --bg: #EFF1EF; --surface: #FFFFFF; --surface-2: #F6F7F6; --hover: #F3F5F4; --selected: #ECEFED;
  --text: #1D2A2E; --muted: #5E6B69; --line: #D8DDDA; --line-soft: #E6E9E7;
  --bar: #1D2A2E; --bar-text: #F1EEE6; --bar-line: #3A4B50;
  --tray: #1D2A2E; --frame: #2A393E;
  --accent: #C6A25A; --accent-hover: #B8934C; --on-accent: #1D2A2E;
  --ink-bg: #1D2A2E; --ink-fg: #F1EEE6; --ink-hover: #26363B;
  --ok: #3D7A5A; --bad: #A33A2E; --bad-bg: #FBF1EF; --bad-line: #E3B7AF;
  --warn-bg: #F6E9C9; --warn-fg: #4A3A12; --warn-line: #E5D3A5;
  --field: #EFF1EF; --overlay: rgba(239, 241, 239, .94); --switch-off: #BFC7C4;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #111819; --surface: #172123; --surface-2: #1D292C; --hover: #1C282B; --selected: #223236;
  --text: #E6EBE9; --muted: #9AA8A5; --line: #2C3B3F; --line-soft: #233034;
  --bar: #0B1112; --bar-text: #F1EEE6; --bar-line: #26353A;
  --tray: #0B1213; --frame: #182427;
  --accent: #C6A25A; --accent-hover: #D3B06A; --on-accent: #1D2A2E;
  --ink-bg: #E6EBE9; --ink-fg: #111819; --ink-hover: #FFFFFF;
  --ok: #72C394; --bad: #EC8A7A; --bad-bg: #2B1D1B; --bad-line: #5B312B;
  --warn-bg: #3A3220; --warn-fg: #F0DFB0; --warn-line: #5A4B28;
  --field: #111819; --overlay: rgba(17, 24, 25, .94); --switch-off: #3C4B4F;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg: #111819; --surface: #172123; --surface-2: #1D292C; --hover: #1C282B; --selected: #223236;
    --text: #E6EBE9; --muted: #9AA8A5; --line: #2C3B3F; --line-soft: #233034;
    --bar: #0B1112; --bar-text: #F1EEE6; --bar-line: #26353A;
    --tray: #0B1213; --frame: #182427;
    --accent: #C6A25A; --accent-hover: #D3B06A; --on-accent: #1D2A2E;
    --ink-bg: #E6EBE9; --ink-fg: #111819; --ink-hover: #FFFFFF;
    --ok: #72C394; --bad: #EC8A7A; --bad-bg: #2B1D1B; --bad-line: #5B312B;
    --warn-bg: #3A3220; --warn-fg: #F0DFB0; --warn-line: #5A4B28;
    --field: #111819; --overlay: rgba(17, 24, 25, .94); --switch-off: #3C4B4F;
    color-scheme: dark;
  }
}
:root {
  --serif: "Hermea Serif", "Cormorant Garamond", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 15px/1.45 var(--sans);
  color: var(--text);
  background: var(--bg);
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- top bar */
.bar {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 60px; padding: 0 14px 0 24px;
  background: var(--bar); color: var(--bar-text);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand .logo { height: 25px; display: block; }
.brand .app-name {
  padding-left: 16px; border-left: 1px solid var(--bar-line);
  font-size: 15px; font-weight: 500; color: rgba(241, 238, 230, .78); line-height: 25px; white-space: nowrap;
}
.bar-right { display: flex; align-items: center; gap: 4px; }
.bar-btn {
  display: flex; align-items: center; gap: 9px;
  background: none; border: 0; border-radius: 8px; padding: 7px 10px;
  color: rgba(241, 238, 230, .84); font-size: 13.5px;
}
.bar-btn:hover, .bar-btn[aria-expanded="true"] { background: rgba(255, 255, 255, .08); }
.tg .dot { width: 8px; height: 8px; border-radius: 50%; background: #8B9693; }
.tg[data-state="ok"] .dot { background: #6FBF8F; }
.tg[data-state="error"] .dot, .tg[data-state="nochat"] .dot { background: #E07A6A; }
.gear { padding: 7px; }

/* ---------- banners */
.banner {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--warn-bg); color: var(--warn-fg); font-size: 14px;
  border-bottom: 1px solid var(--warn-line);
}
.banner button {
  border: 1px solid currentColor; background: transparent; border-radius: 7px; padding: 5px 12px; font-weight: 600; color: inherit;
}
.banner button:hover { background: rgba(185, 156, 89, .15); }
.banner.update { background: var(--surface); color: var(--text); border-bottom-color: var(--line); }
.banner.update b { font-weight: 600; }
.banner.update .muted { color: var(--muted); }
.banner.update button { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.banner.update button:hover { background: var(--accent-hover); }

/* ---------- settings popover */
.pop {
  position: fixed; top: 54px; right: 12px; z-index: 25; width: 340px;
  background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .22); padding: 18px;
}
.pop h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.pop section + section { margin-top: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 7px 6px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.upd-line { font-size: 13.5px; margin: 0 0 10px; color: var(--muted); }
.upd-line b { color: var(--text); font-weight: 600; }

/* ---------- sidebar */
.side {
  grid-row: 4; display: flex; flex-direction: column; min-height: 0;
  background: var(--surface); border-right: 1px solid var(--line);
}
.search { padding: 16px 16px 8px; }
.search input {
  width: 100%; height: 38px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--field);
}
.search input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
.group { margin: 14px 10px 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.item {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center;
  width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; text-align: left;
  position: relative;
}
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--selected); }
.item[aria-current="true"]::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent);
}
.thumb {
  width: 64px; height: 48px; border-radius: 4px; object-fit: cover; background: var(--line-soft); display: block;
}
.thumb.job { background: var(--tray); display: grid; place-items: center; overflow: hidden; }
.thumb.job.err { background: var(--bad-bg); color: var(--bad); font-weight: 700; font-size: 20px; }
.thumb.srch { background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.item .t { font-size: 14px; font-weight: 500; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.item .s .err { color: var(--bad); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; }
.mini { height: 3px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.add-link { display: flex; align-items: center; gap: 8px; margin: 2px 8px 0; padding: 7px 8px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-size: 13.5px; width: calc(100% - 16px); text-align: left; }
.add-link:hover { background: var(--hover); color: var(--text); }
.empty-list { margin: 24px 12px; color: var(--muted); font-size: 14px; }
.side-foot { padding: 14px 18px 18px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--muted); }
.side-foot p { margin: 0 0 6px; }
.link { background: none; border: 0; padding: 0; color: var(--text); font-weight: 500; text-decoration: underline;
  text-decoration-color: var(--line); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--accent); }

/* ---------- main */
.main { grid-row: 4; overflow-y: auto; min-width: 0; position: relative; }
.composer, .work { max-width: 1120px; padding: 0 40px; }
.composer { padding-top: 30px; }
.display {
  font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.1;
  margin: 0 0 16px; letter-spacing: -.005em;
}
.slot {
  display: flex; align-items: flex-start; gap: 8px; padding: 6px;
  background: var(--surface); border: 2px solid var(--text); border-radius: 12px;
}
.slot:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(198, 162, 90, .22); }
.slot textarea {
  flex: 1; min-width: 0; border: 0; resize: none; background: none; outline: none;
  font-size: 16px; line-height: 24px; padding: 12px 10px; max-height: 132px; overflow-y: auto;
}
.slot textarea::placeholder { color: var(--muted); opacity: .8; }
.btn-primary {
  flex: none; height: 48px; padding: 0 30px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 16px;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .55; cursor: default; }
.btn-primary.sm { height: 34px; padding: 0 14px; font-size: 14px; }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 14px; font-size: 14px; }
.hint { color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 36px; height: 21px; border-radius: 11px; background: var(--switch-off); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .track { background: var(--ok); }
.switch.nofee input:checked + .track { background: var(--accent); }
.switch.nofee:has(input:checked) { color: var(--accent); font-weight: 600; }
.nofee-tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--on-accent); background: var(--accent); vertical-align: middle; }
.switch input:checked + .track::after { transform: translateX(15px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.notice { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.notice .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.notice .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.notice .u { flex: 1 1 260px; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice.err { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad); }
.own-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.own-row input[type="text"] { flex: 1 1 300px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
.own-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
.own-thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.own-thumbs img { width: 56px; height: 42px; object-fit: cover; border-radius: 4px; background: var(--surface-2); }

.btn {
  height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--muted); background: var(--surface-2); }
.btn.ink { background: var(--ink-bg); color: var(--ink-fg); border-color: var(--ink-bg); }
.btn.ink:hover { background: var(--ink-hover); }
.btn:disabled { opacity: .55; cursor: default; }

/* ---------- work area */
.work { padding-top: 34px; padding-bottom: 48px; }
.work-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
.work-title { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.12; margin: 0; overflow-wrap: anywhere; }
.work-sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.work-sub .ok { color: var(--ok); }
.work-sub .bad { color: var(--bad); }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.text-btn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; }
.text-btn:hover { color: var(--bad); }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 20px; }
.step .rail { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.step .rail i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }
.step .lbl { margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step.on .lbl { color: var(--text); font-weight: 600; }
.step.done .lbl { color: var(--text); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 1240px) { .body { grid-template-columns: minmax(0, 1fr); } }

.tray {
  position: relative; background: var(--tray); border-radius: 14px; padding: 16px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px;
}
.frame {
  position: relative; aspect-ratio: 4 / 3; border-radius: 4px; background: var(--frame);
  overflow: hidden; border: 0; padding: 0; display: block; width: 100%;
}
button.frame:hover { box-shadow: 0 0 0 2px var(--accent); }
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.frame .no {
  position: absolute; left: 8px; bottom: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
  color: rgba(241, 238, 230, .45); font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,.6);
}
.frame.has .no { color: var(--accent); }
.frame.busy { box-shadow: inset 0 0 0 1px rgba(198, 162, 90, .65); }
.frame img.dev { animation: develop 1.1s ease-out both; }
@keyframes develop {
  from { filter: grayscale(1) brightness(.18) contrast(1.6); }
  60% { filter: grayscale(.4) brightness(.8) contrast(1.15); }
  to { filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  .frame img.dev { animation: none; }
  .mini i, .step .rail i { transition: none; }
}
.tray-empty {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 30px;
  color: #F1EEE6; pointer-events: none;
}
.tray-empty b { font-family: var(--serif); font-weight: 600; font-size: 27px; line-height: 1.15; display: block; }
.tray-empty span { display: block; margin-top: 8px; color: rgba(241, 238, 230, .66); font-size: 14px; max-width: 34em; }
.tray.dim { grid-template-columns: repeat(5, 1fr); }
.tray.dim .frame { opacity: .4; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; position: sticky; top: 20px; }
@media (max-width: 1240px) { .sheet { position: static; } }
.sheet-top { display: grid; gap: 8px; }
.sheet-top .btn { justify-content: center; height: 42px; font-size: 14.5px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; margin: 18px 0 18px; padding: 16px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.facts div { min-width: 0; }
.facts dt { font-size: 12.5px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts .total { grid-column: 1 / -1; }
.facts .total dd { font-family: var(--serif); font-size: 32px; line-height: 1.05; font-weight: 600; }
#jFacts .facts { margin-top: 0; padding-top: 0; border-top: 0; }
.sheet h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.opis {
  width: 100%; min-height: 220px; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2);
  padding: 12px; font-size: 14px; line-height: 1.55; resize: vertical;
}
.opis:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.oto { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.oto summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style-position: inside; }
.oto[open] summary { margin-bottom: 10px; }
.oto .btn { margin-top: 8px; }
.opis-wait { padding: 14px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 14px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.actions { display: grid; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.actions .btn { justify-content: flex-start; height: 40px; }
.actions .btn svg { flex: none; }
.tg-line { margin-top: 12px; font-size: 13px; color: var(--muted); }
.tg-line.bad { color: var(--bad); }

.queue { margin-top: 22px; }
.queue h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.queue .q { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.queue .q span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.fail { background: var(--surface); border: 1px solid var(--bad-line); border-radius: 12px; padding: 22px; max-width: 760px; }
.fail p { margin: 0 0 16px; }
.log { margin: 14px 0 0; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; }

/* ---------- searches */
.filters { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 0 0 16px; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card.new { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.hidden-new { color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: baseline; }
.card .pic { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); flex: none; overflow: hidden; }
.card .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .tags { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.card .tags > * { white-space: nowrap; }
.card .pic.noimg { background: var(--surface-2) url("/app/mark.png") center / 40px no-repeat; }
.tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
.tag.own { background: #3D7A5A; color: #fff; }
.card .cb { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card .price { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.05; font-variant-numeric: lining-nums; }
.card .price small { font-family: var(--sans); font-size: 12.5px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.card .ttl { font-size: 14px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: auto; padding-top: 10px; }
.card .acts > * { white-space: nowrap; }
.add-search { max-width: 760px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
.add-search p { margin: 0 0 14px; color: var(--muted); }
.add-search .own-row input { flex: 1 1 380px; }

/* ---------- lightbox */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(12, 18, 20, .96); display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.lb-wrap { display: grid; place-items: center; padding: 28px 80px 12px; min-height: 0; }
.lb-stage { position: relative; display: inline-block; max-width: 100%; max-height: 100%; user-select: none; touch-action: none; }
.lb-stage > img { display: block; max-width: calc(100vw - 160px); max-height: calc(100vh - 110px); border-radius: 4px; }
.lb-before { position: absolute; inset: 0; overflow: hidden; border-radius: 4px; }
.lb-before img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lb-handle { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); transform: translateX(-1px); cursor: ew-resize; }
.lb-handle::after {
  content: ""; position: absolute; top: 50%; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.4);
}
.lb-tag { position: absolute; top: 12px; padding: 4px 10px; border-radius: 6px; background: rgba(17, 25, 27, .7); color: #F1EEE6; font-size: 13px; font-weight: 600; }
.lb-tag.l { left: 12px; } .lb-tag.r { right: 12px; }
.lb-stage.compare { cursor: ew-resize; }
.lb-bar { display: flex; align-items: center; gap: 16px; padding: 12px 24px 18px; color: rgba(241, 238, 230, .8); font-size: 14px; }
.lb-bar .grow { flex: 1; color: rgba(241, 238, 230, .55); }
.lb-bar .btn { background: transparent; color: #F1EEE6; border-color: rgba(241, 238, 230, .25); }
.lb-bar .btn:hover { background: rgba(255, 255, 255, .08); }
.lb-nav {
  position: absolute; top: 50%; margin-top: -40px; width: 52px; height: 52px; border-radius: 50%;
  border: 0; background: rgba(255, 255, 255, .08); color: #F1EEE6; font-size: 30px; line-height: 1;
}
.lb-nav:hover { background: rgba(255, 255, 255, .16); }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }

.drop {
  position: fixed; inset: 12px; z-index: 18; border: 3px dashed var(--accent); border-radius: 18px;
  background: var(--overlay); display: grid; place-content: center; text-align: center; pointer-events: none;
}
.drop b { font-family: var(--serif); font-size: 32px; font-weight: 600; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink-bg); color: var(--ink-fg); padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 30;
  transition: opacity .2s, transform .2s; max-width: 80vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: #fff; }

.gone { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: grid; place-content: center; text-align: center; }
.gone b { font-family: var(--serif); font-size: 30px; font-weight: 600; }
.gone p { color: var(--muted); }

/* ---------- motion: things respond to the hand */
.btn, .btn-primary, .bar-btn, .text-btn, .seg button, .add-link, .item, .link, .lb-nav, .banner button, .switch .track {
  transition: background-color .16s, border-color .16s, color .16s, box-shadow .2s, transform .14s cubic-bezier(.3, 1.4, .5, 1);
}
.btn:active:not(:disabled), .btn-primary:active:not(:disabled), .seg button:active, .bar-btn:active, .add-link:active, .lb-nav:active { transform: scale(.96); }
.item:active { transform: scale(.985); }
.item .thumb { transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.item:hover .thumb { transform: scale(1.06); }
.item[aria-current="true"]::before { animation: barIn .3s cubic-bezier(.2, .8, .2, 1) both; transform-origin: center; }
@keyframes barIn { from { transform: scaleY(0); } }
.bar { position: relative; z-index: 6; transition: box-shadow .3s; }
body.scrolled .bar { box-shadow: 0 6px 24px rgba(10, 18, 20, .28); }
.main { scroll-behavior: smooth; }
.pop:not([hidden]) { animation: popIn .24s cubic-bezier(.2, .9, .3, 1.2) both; transform-origin: top right; }
.toast { transition: opacity .25s, transform .5s cubic-bezier(.2, 1.5, .4, 1); }
.slot { transition: border-color .2s, box-shadow .3s; }
.btn-primary:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(198, 162, 90, .35); }
.banner:not([hidden]) { animation: bannerIn .4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-8px); } }
.notice:not([hidden]) { animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }

/* photo tray: frames are touchable */
.frame { transition: box-shadow .2s, transform .3s cubic-bezier(.2, .8, .2, 1); }
.frame img { transition: transform .6s cubic-bezier(.2, .8, .2, 1), filter .3s; }
button.frame:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--accent), 0 10px 22px rgba(0, 0, 0, .35); }
button.frame:hover img { transform: scale(1.05); }
.frame.busy::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(198, 162, 90, .16) 50%, transparent 80%);
  background-size: 220% 100%; animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* search cards */
.card { transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, border-color .2s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(16, 26, 29, .14); }
html[data-theme="dark"] .card:hover { box-shadow: 0 16px 34px rgba(0, 0, 0, .45); }
.card .pic img { transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
.card:hover .pic img { transform: scale(1.06); }
.card.reveal { opacity: 0; transform: translateY(22px); }
.card.reveal.in { opacity: 1; transform: none; transition: opacity .6s cubic-bezier(.2, .8, .2, 1), transform .6s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, border-color .2s; transition-delay: var(--d, 0ms); }
.card.reveal.in:hover { transform: translateY(-4px); transition-delay: 0ms; }
.card.new .tag:first-child { animation: tagPulse 2.4s ease-in-out infinite; }
@keyframes tagPulse { 50% { box-shadow: 0 0 0 5px rgba(198, 162, 90, .25); } }

/* lightbox: open from the thumbnail, zoom and pan */
.lb:not([hidden]) { animation: lbIn .28s ease-out both; }
.lb.closing { animation: lbOut .2s ease-in forwards; }
@keyframes lbIn { from { background: rgba(12, 18, 20, 0); } }
@keyframes lbOut { to { opacity: 0; } }
.lb-wrap { overflow: hidden; }
.lb-stage { transform-origin: 0 0; will-change: transform; }
.lb-stage.anim { transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.lb-stage.zoomed { cursor: grab; }
.lb-stage.zoomed.panning { cursor: grabbing; }
.lb-stage.zoomed .lb-handle, .lb-stage.zoomed .lb-tag { opacity: 0; pointer-events: none; }
.lb-handle, .lb-tag { transition: opacity .2s; }
.lb-zoom { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 20px; background: rgba(17, 25, 27, .75); color: #F1EEE6; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .25s; pointer-events: none; }
.lb-zoom.show { opacity: 1; }
.lb-bar .bar-z { display: inline-flex; gap: 4px; }
.lb-bar .bar-z .btn { width: 36px; padding: 0; justify-content: center; font-size: 18px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .card.reveal { opacity: 1; transform: none; }
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }

async function api(path, body) {

    opt.body = JSON.stringify(body);

  const r = await fetch(path, opt);

}

function enter(root, sel) {

  let i = 0;
  root.querySelectorAll(sel || ":scope > *").forEach((el) => {
    if (i > 14) return;
    el.classList.remove("rise"); void el.offsetWidth;
    el.style.setProperty("--i", i++);

function countUp(el) {
  if (!el || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  const txt = el.textContent, m = txt.match(/^(\D*)([\d\s\u00a0]+)(\D*)$/);
  if (!m) return;
  const to = +m[2].replace(/\D/g, "");
  if (!to) return;
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / 900), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
    el.textContent = m[1] + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + m[3];
    if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
  };
  requestAnimationFrame(step);
}

const NOTE = { last: null };

function showNotes(notes) {
  if (!notes) return;
  const max = notes.reduce((m, n) => Math.max(m, n.id), 0);
  if (NOTE.last === null) { NOTE.last = max; return; }      // старые при открытии окна не показываем
  for (const n of notes) {
    if (n.id <= NOTE.last) continue;
    if (canNote()) {
      try {

        no.onclick = () => { window.focus(); no.close(); goTarget(n.target || {}); };

async function tick1() {

      try { sessionStorage.setItem("hermea_updated", S.st.version); } catch (e) {}
      location.reload();
      return;
    }
    for (const j of S.st.jobs || []) {

    }
    if (j.status === "done" && j.f) return select({ kind: "flat", f: j.f });
    if (j.status === "cancelled") { S.sel = null; S.view = ""; return renderWork(); }
    if (j.status === "error") return drawError(j);
    return drawJob(j);
  }
  if (sel && sel.kind === "flat") { if (S.flat) drawFlat(S.flat); return; }
  if (sel && sel.kind === "search") { refreshSearchIfNeeded(); if (S.srch) drawSearch(S.srch); return; }
  if (sel && sel.kind === "addsearch") return drawAddSearch();
  const run = (S.st && S.st.jobs || []).find((j) => j.status === "running");
  if (run) { S.sel = { kind: "job", id: run.id }; S.listSig = ""; return renderWork(); }
  if (S.view !== "empty:" + LANG) {
    S.view = "empty:" + LANG;
    let frames = "";
    for (let i = 1; i <= 10; i++) frames += `<div class="frame"><span class="no">${i}</span></div>`;
    w.innerHTML = `<div class="tray dim">${frames}
      <div class="tray-empty"><b>${t("empty_title")}</b><span>${t("empty_text")}</span></div></div>`;
    enter(w.querySelector(".tray"), ".frame");
  }
}

const STEPS = ["listing", "photos", "saving", "telegram"];
function stepsHtml(j) {
  const idx = j.status === "queued" ? -1 : STEPS.indexOf(j.step);
  return STEPS.map((key, i) => {
    let fill = 0, cls = "";
    let text = t(key === "listing" ? (j.kind === "local" ? "step_own" : "step_listing") : key === "photos" ? "step_photos" : key === "saving" ? "step_saving" : "step_tg");
    if (i < idx) { fill = 100; cls = "done"; }
    if (i === idx) {
      cls = "on";
      fill = key === "photos" && j.total ? Math.max(4, Math.round(((j.k - 1) / j.total) * 100)) : 40;
      if (key === "photos" && j.total) text = t("st_photos", { k: j.k, t: j.total });
    }
    if (key === "telegram" && !j.telegram) { text = t("step_tg_off"); fill = 0; cls = ""; }
    return `<div class="step ${cls}"><div class="rail"><i style="width:${fill}%"></i></div><div class="lbl">${esc(text)}</div></div>`;
  }).join("");
}
function factsHtml(facts) {
  if (!facts || !facts.length) return "";
  const label = { "Всего": "f_total", "Аренда": "f_rent", "Czynsz": "f_czynsz", "Залог": "f_deposit" };

// карточки поиска выплывают по мере прокрутки; уже показанные больше не мигают
const REVEALED = new Set();
let revealIO = null;
function revealCards(sid) {
  const cards = [...document.querySelectorAll("#sCards .card")];
  if (!("IntersectionObserver" in window)) return;
  if (!revealIO) revealIO = new IntersectionObserver((ents) => {
    let k = 0;
    for (const e of ents) {
      if (!e.isIntersecting) continue;
      const c = e.target;
      c.style.setProperty("--d", (k++ % 6) * 70 + "ms");
      c.classList.add("in");
      REVEALED.add(c.dataset.rid);
      revealIO.unobserve(c);
    }
  }, { root: $("#main"), rootMargin: "0px 0px -40px 0px", threshold: 0.08 });
  cards.forEach((c) => {
    const id = sid + ":" + (c.querySelector("[data-proc]") || {}).dataset.proc;
    c.dataset.rid = id;
    if (REVEALED.has(id)) return;
    c.classList.add("reveal");
    revealIO.observe(c);
  });
}

    if (r.error) throw new Error(r.error);
    if (r.search) { showSearchOffer(r.search); return; }
    if (r.added && r.added.length) {
      $("#noFee").checked = false;          // «без комиссии» — только для этих ссылок
      if (link.value.trim() === text.trim()) { link.value = ""; fitLink(); }
      toast(r.added.length === 1 ? t("started") : t("added_n", { n: r.added.length, links: plural(r.added.length, "links") }));
      const busy = S.st && (S.st.jobs || []).some((j) => j.status === "running");
      S.st = await api("/api/state");
      if (!busy || !S.sel || S.sel.kind !== "job") select({ kind: "job", id: r.added[0].id });
      S.listSig = "";
      renderList(); renderWork();
    }
    if (r.dups && r.dups.length) showDups(r.dups);
  } catch (e) {
    notice.className = "notice err";
    notice.textContent = e.message;
    notice.hidden = false;
  } finally {
    go.disabled = false;
  }
}
function showSearchOffer(url) {
  const n = $("#notice");
  n.className = "notice";
  n.innerHTML = `<div class="row"><strong>${t("search_detected")}</strong>
    <button class="btn-primary sm" type="button" id="offerWatch">${t("watch")}</button></div>`;
  n.hidden = false;
  $("#offerWatch").onclick = () => { link.value = ""; fitLink(); addSearch(url); };
}
function showDups(dups) {
  const n = $("#notice");
  n.className = "notice";
  n.innerHTML = dups.map((d, i) => `<div class="row">
      <strong>${d.active ? t("dup_active") : t("dup_done")}</strong>
      <span class="u">${esc(d.url)}</span>
      ${d.f ? `<button class="btn" type="button" data-open="${esc(d.f)}">${t("open")}</button>` : ""}
      ${d.active ? "" : `<button class="btn ink" type="button" data-again="${i}">${t("redo")}</button>`}
    </div>`).join("");
  n.hidden = false;
  n.onclick = (e) => {
    const o = e.target.closest("[data-open]");
    const a = e.target.closest("[data-again]");
    if (o) { n.hidden = true; select({ kind: "flat", f: o.dataset.open }); }
    if (a) { n.hidden = true; create(dups[+a.dataset.again].url, true); }
  };
}
const link = $("#link");
function fitLink() { link.style.height = "auto"; link.style.height = Math.min(link.scrollHeight, 132) + "px"; }
link.addEventListener("input", () => { fitLink(); if (!S.own) $("#notice").hidden = true; });
link.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); }
});
$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = link.value.trim();
  if (!v) { link.focus(); return toast(t("need_link"), true); }
  create(v, false);
});
document.addEventListener("paste", (e) => {
  const tg = e.target;
  if (tg.closest && tg.closest("input, textarea")) return;
  const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(isImage);
  if (files.length) { e.preventDefault(); addOwn(files); return; }
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  e.preventDefault();
  link.value = text.trim();
  fitLink();
  link.focus();
});
$("#tgSend").addEventListener("change", (e) => {
  e.target.dataset.touched = "1";
  api("/api/settings", { telegram: e.target.checked }).catch(() => {});
});

// ================================================================ свои фото
function isImage(f) { return /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name); }
$("#ownBtn").addEventListener("click", () => $("#ownFile").click());
$("#ownFile").addEventListener("change", (e) => { const f = [...e.target.files]; e.target.value = ""; if (f.length) addOwn(f); });
function addOwn(files) {
  const ok = files.filter(isImage);
  if (!ok.length) return toast(t("own_noimg"), true);
  if (!S.own) S.own = { files: [] };
  S.own.files.push(...ok);
  drawOwn();
}
function drawOwn(progress) {
  const n = $("#notice");
  if (!S.own) { n.hidden = true; return; }
  const k = S.own.files.length;
  const prev = S.own.files.slice(0, 14).map((f) => /heic|heif/i.test(f.name) ? `<img alt="">` : `<img alt="" src="${URL.createObjectURL(f)}">`).join("");
  const name = $("#ownName") ? $("#ownName").value : (S.own.name || "");
  n.className = "notice";
  n.innerHTML = `<div class="row"><strong>${t("own_title")}</strong><span class="hint">${esc(t("own_selected", { n: k }))}</span>
      <button class="text-btn" type="button" id="ownMore">${t("own_more")}</button></div>
    <div class="own-thumbs">${prev}</div>
    <form class="own-row" id="ownForm"><input type="text" id="ownName" placeholder="${esc(t("own_name_ph"))}" value="${esc(name)}">
      <button class="btn-primary sm" type="submit" id="ownGo"${progress ? " disabled" : ""}>${progress || t("own_go")}</button>
      <button class="btn" type="button" id="ownCancel"${progress ? " disabled" : ""}>${t("own_cancel")}</button></form>`;
  n.hidden = false;
  $("#ownMore").onclick = () => $("#ownFile").click();
  $("#ownCancel").onclick = () => { S.own = null; n.hidden = true; };
  $("#ownForm").onsubmit = (e) => { e.preventDefault(); S.own.name = $("#ownName").value; uploadOwn(); };
  if (!progress) $("#ownName").focus();
}
async function uploadOwn() {
  const own = S.own;
  if (!own || !own.files.length) return;
  const uid = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
  try {
    for (let i = 0; i < own.files.length; i++) {
      drawOwn(t("own_uploading", { i: i + 1, n: own.files.length }));
      const f = own.files[i];
      const r = await fetch(`/api/upload?u=${uid}&n=${encodeURIComponent(f.name)}`, { method: "POST", headers: { "X-Hermea": T }, body: f });
      if (!r.ok) { let m = "HTTP " + r.status; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
    }
    const r = await api("/api/create_local", { u: uid, name: own.name || "", telegram: $("#tgSend").checked, no_fee: $("#noFee").checked });
    if (r.error) throw new Error(r.error);
    $("#noFee").checked = false;
    S.own = null;
    $("#notice").hidden = true;
    toast(t("started"));
    S.st = await api("/api/state");
    select({ kind: "job", id: r.added[0].id });
  } catch (e) {
    toast(e.message, true);
    drawOwn();
  }
}
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer && e.dataTransfer.types || [])].includes("Files");
document.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; $("#drop").hidden = false; } });
document.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0; $("#drop").hidden = true;
  const files = [...(e.dataTransfer.files || [])];
  if (files.length) { addOwn(files); return; }
  const text = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
  if (text && text.startsWith(location.origin)) return;     // перетащили картинку из самого окна
  if (text) { link.value = text.trim(); fitLink(); link.focus(); }
});

// ================================================================ просмотр фото (до / после, приближение)
const LB = { list: [], i: 0, pos: 50, drag: false, z: 1, tx: 0, ty: 0, pan: null };
const stage = $("#lbStage");
const RMQ = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function openLb(list, i, fromImg) {
  LB.list = list; LB.i = i;
  const lb = $("#lb");
  lb.classList.remove("closing");
  lb.hidden = false;
  showLb(0, fromImg);
}
function closeLb() {
  const lb = $("#lb");
  if (lb.hidden) return;
  if (RMQ) { lb.hidden = true; return; }
  lb.classList.add("closing");
  setTimeout(() => { if (lb.classList.contains("closing")) { lb.hidden = true; lb.classList.remove("closing"); } }, 190);
}
function setZoom(z, tx, ty, anim) {
  const b = baseRect();
  LB.z = Math.max(1, Math.min(5, z));
  const minX = b.w * (1 - LB.z), minY = b.h * (1 - LB.z);
  LB.tx = LB.z === 1 ? 0 : Math.min(0, Math.max(minX, tx));
  LB.ty = LB.z === 1 ? 0 : Math.min(0, Math.max(minY, ty));
  stage.classList.toggle("anim", !!anim && !RMQ);
  const Z = window.ZOOM || 1;
  stage.style.transform = LB.z === 1 ? "" : `translate(${LB.tx / Z}px, ${LB.ty / Z}px) scale(${LB.z})`;
  stage.classList.toggle("zoomed", LB.z > 1);
  const zl = $("#lbZoom");
  zl.textContent = Math.round(LB.z * 100) + "%";
  zl.classList.toggle("show", LB.z > 1);
  clearTimeout(LB.zt);
  LB.zt = setTimeout(() => zl.classList.remove("show"), 1200);
  hintLb();
}
function baseRect() {          // где фото стоит без приближения
  const r = stage.getBoundingClientRect();
  return { left: r.left - LB.tx, top: r.top - LB.ty, w: r.width / LB.z, h: r.height / LB.z };
}
function zoomAt(cx, cy, z, anim) {
  const b = baseRect();
  const ux = (cx - b.left - LB.tx) / LB.z, uy = (cy - b.top - LB.ty) / LB.z;
  const nz = Math.max(1, Math.min(5, z));
  setZoom(nz, cx - b.left - ux * nz, cy - b.top - uy * nz, anim);
}
function hintLb() {
  const p = LB.list[LB.i];
  $("#lbHint").textContent = LB.z > 1 ? t("zoom_back") : (p && p.orig ? t("compare_hint") + ". " : "") + t("zoom_hint");
}
function showLb(dir, fromImg) {
  const p = LB.list[LB.i];
  const hasOrig = !!p.orig;
  setZoom(1, 0, 0);
  const after = $("#lbAfter");
  // сначала уже загруженная превьюшка (мгновенно), потом чёткое фото
  after.src = img(p.f, 520);
  const hi = new Image();
  hi.onload = () => { if (LB.list[LB.i] === p) after.src = hi.src; };
  hi.src = img(p.f, 2200);
  $("#lbBefore").hidden = !hasOrig;
  $("#lbHandle").hidden = !hasOrig;
  $("#lbTagL").hidden = !hasOrig;
  $("#lbTagR").hidden = !hasOrig;
  stage.classList.toggle("compare", hasOrig);
  if (hasOrig) $("#lbBeforeImg").src = img(p.orig, 2200);
  $("#lbCount").textContent = t("i_of_n", { i: LB.i + 1, n: LB.list.length });
  hintLb();
  LB.pos = 50; setPos();
  if (RMQ) return;
  const go = () => {
    if (fromImg && fromImg.isConnected) {
      const r1 = fromImg.getBoundingClientRect(), r2 = stage.getBoundingClientRect();
      if (r2.width > 0) {
        const Z = window.ZOOM || 1;
        stage.animate([
          { transform: `translate(${(r1.left - r2.left) / Z}px, ${(r1.top - r2.top) / Z}px) scale(${r1.width / r2.width})`, opacity: .4 },
          { transform: "translate(0, 0) scale(1)", opacity: 1 }],
        { duration: 420, easing: "cubic-bezier(.2, .8, .2, 1)" });
        return;
      }
    }
    if (dir) stage.animate([{ transform: `translateX(${dir * 40}px)`, opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 320, easing: "cubic-bezier(.2, .8, .2, 1)" });
  };
  if (after.decode) after.decode().then(go, go); else go();
}
function setPos() {
  $("#lbBefore").style.clipPath = `inset(0 ${100 - LB.pos}% 0 0)`;
  $("#lbHandle").style.left = LB.pos + "%";
}
function movePos(e) {
  const r = stage.getBoundingClientRect();
  LB.pos = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));   // доли — масштаб не важен
  setPos();
}
stage.addEventListener("dragstart", (e) => e.preventDefault());
stage.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (LB.z > 1) {
    LB.pan = { x: e.clientX, y: e.clientY, tx: LB.tx, ty: LB.ty };
    stage.classList.add("panning");
    stage.setPointerCapture(e.pointerId);
    return;
  }
  if (!stage.classList.contains("compare")) return;
  LB.drag = true; stage.setPointerCapture(e.pointerId); movePos(e);
});
stage.addEventListener("pointermove", (e) => {
  if (LB.pan) return setZoom(LB.z, LB.pan.tx + e.clientX - LB.pan.x, LB.pan.ty + e.clientY - LB.pan.y);
  if (LB.drag) movePos(e);
});
const endDrag = () => { LB.drag = false; LB.pan = null; stage.classList.remove("panning"); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("dblclick", (e) => {
  e.preventDefault();
  if (LB.z > 1) setZoom(1, 0, 0, true); else zoomAt(e.clientX, e.clientY, 2.5, true);
});
$("#lb").addEventListener("wheel", (e) => {
  if ($("#lb").hidden) return;
  e.preventDefault();
  const k = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022));
  zoomAt(e.clientX, e.clientY, LB.z * k, false);
}, { passive: false });
function zoomCenter(f) { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, LB.z * f, true); }
$("#lbIn").onclick = () => zoomCenter(1.6);
$("#lbOut").onclick = () => zoomCenter(1 / 1.6);
$("#lbClose").onclick = closeLb;
$("#lbPrev").onclick = () => { LB.i = (LB.i - 1 + LB.list.length) % LB.list.length; showLb(-1); };
$("#lbNext").onclick = () => { LB.i = (LB.i + 1) % LB.list.length; showLb(1); };
$("#lbReveal").onclick = () => api("/api/open", { what: "photo", f: LB.list[LB.i].f }).catch((e) => toast(e.message, true));
$("#lb").addEventListener("click", (e) => { if (e.target.classList.contains("lb-wrap") && LB.z === 1) closeLb(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#pop").hidden) return togglePop(false);
  if ($("#lb").hidden) return;
  if (e.key === "Escape") { if (LB.z > 1) setZoom(1, 0, 0, true); else closeLb(); }
  if (e.key === "ArrowLeft") $("#lbPrev").click();
  if (e.key === "ArrowRight") $("#lbNext").click();
  if (e.key === "+" || e.key === "=") zoomCenter(1.6);
  if (e.key === "-") zoomCenter(1 / 1.6);
});
// тень под шапкой, когда страница прокручена
for (const sc of [$("#main"), $("#svk"), $("#clients"), $("#market")]) {
  sc.addEventListener("scroll", () => document.body.classList.toggle("scrolled", sc.scrollTop > 6), { passive: true });
}

window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye?t=" + T, ""); } catch (e) {} });
try { if (window.outerWidth < 1200) window.resizeTo(1400, 920); } catch (e) {}
applyStatic();
try {
  const upd = sessionStorage.getItem("hermea_updated");
  if (upd) { sessionStorage.removeItem("hermea_updated"); setTimeout(() => toast(t("upd_done", { v: upd })), 600); }
} catch (e) {}
link.focus();
tick();
</script>

<script src="/app/templates.js"></script>
<script src="/app/clients.js"></script>
<script src="/app/owners.js"></script>
